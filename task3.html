<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 3 - Reserve a Table</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

  <div class="container max-width-500 bg-white p-4 rounded shadow-sm" style="max-width: 500px;">
    <h2 class="mb-4">Reserve a table</h2>
    
    <form action="/reserve" method="post">
      <!-- 1 & 2. Name & Email -->
      <div class="mb-3">
        <label for="userName" class="form-label">Your name</label>
        <input type="text" class="form-control" id="userName" name="userName" required>
      </div>

      <div class="mb-3">
        <label for="userEmail" class="form-label">Email</label>
        <input type="email" class="form-control" id="userEmail" name="userEmail" required>
      </div>

      <!-- 3. Phone -->
      <div class="mb-3">
        <label for="phone" class="form-label">Phone</label>
        <input type="tel" class="form-control" id="phone" name="phone" required>
      </div>

      <!-- 4. Guests -->
      <div class="mb-3">
        <label for="people" class="form-label">Guests</label>
        <input type="number" class="form-control" id="people" name="guests" min="1" required>
      </div>

      <!-- 5. Date -->
      <div class="mb-3">
        <label for="resDate" class="form-label">Date</label>
        <input type="date" class="form-control" id="resDate" name="date" required>
      </div>

      <!-- 6. Seating -->
      <fieldset class="mb-3">
        <legend class="col-form-label pt-0 fw-bold">Seating</legend>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="seating" id="seatInside" value="inside" checked>
          <label class="form-check-label" for="seatInside">Inside</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="seating" id="seatTerrace" value="terrace">
          <label class="form-check-label" for="seatTerrace">Terrace</label>
        </div>
      </fieldset>

      <!-- 7. Time slot -->
      <div class="mb-3">
        <label for="mealTime" class="form-label">Meal time</label>
        <select class="form-select" id="mealTime" name="mealTime">
          <option value="lunch">Lunch</option>
          <option value="dinner">Dinner</option>
        </select>
      </div>

      <!-- 8. Comments -->
      <div class="mb-3">
        <label for="comments" class="form-label">Comments</label>
        <textarea class="form-control" id="comments" name="comments" placeholder="Comments"></textarea>
      </div>

      <!-- 9. Terms -->
      <div class="mb-3 form-check">
        <input class="form-check-input" type="checkbox" id="terms" name="terms" required>
        <label class="form-check-label" for="terms">I agree to the terms</label>
      </div>

      <!-- 10. Submit Button -->
      <button type="submit" class="btn btn-primary w-100">Reserve</button>
    </form>
  </div>

</body>
</html>
